name: gastoclaro
description: GastoClaro - gestion de gastos personales con presupuestos, foto de ticket y sincronizacion.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  supabase_flutter: ^2.5.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  path: ^1.9.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  provider: ^6.1.2
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
